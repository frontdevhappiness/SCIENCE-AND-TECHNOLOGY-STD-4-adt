    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('[data-true-false-input]').forEach(function (writtenInput) {
                var radioName = writtenInput.getAttribute('data-radio-name');
                var radios = Array.from(document.querySelectorAll('input[type="radio"][name="' + radioName + '"]'));
                var feedback = writtenInput.parentElement.querySelector('.written-answer-feedback');
                var marks = radios.map(function (radio) { return radio.closest('label').querySelector('.validation-mark'); });
                function syncWrittenAnswer() {
                    var answer = writtenInput.value.trim().toLowerCase();
                    var selected = radios.find(function (radio) { return radio.value === answer; });
                    radios.forEach(function (radio) { radio.checked = radio === selected; });
                    marks.forEach(function (mark) { mark.classList.add('hidden'); mark.innerHTML = ''; });
                    feedback.innerHTML = ''; feedback.removeAttribute('aria-label');
                    (selected || radios[0]).dispatchEvent(new Event('change', { bubbles:true }));
                }
                function mirrorValidation() {
                    var visibleMark = marks.find(function (mark) { return !mark.classList.contains('hidden'); });
                    feedback.innerHTML = visibleMark ? visibleMark.innerHTML : '';
                    if (visibleMark) {
                        var correct = Boolean(visibleMark.querySelector('.fa-check-circle'));
                        feedback.setAttribute('aria-label', correct ? 'Correct' : 'Incorrect');
                    } else feedback.removeAttribute('aria-label');
                }
                writtenInput.addEventListener('input', syncWrittenAnswer);
                writtenInput.addEventListener('change', syncWrittenAnswer);
                radios.forEach(function (radio) { radio.addEventListener('focus', function () { writtenInput.focus(); }); });
                var observer = new MutationObserver(mirrorValidation);
                marks.forEach(function (mark) { observer.observe(mark, { attributes:true, childList:true, subtree:true, attributeFilter:['class'] }); });
            });
        });
    </script>
